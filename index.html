<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suivi de dépenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#060607}
  body{font-family:'Instrument Sans',system-ui,sans-serif;overflow-x:hidden}
  input,select,button{font-family:inherit}
  input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.6)}
  .flex{display:flex}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}.flex-1{flex:1}
  .items-center{align-items:center}.items-end{align-items:flex-end}
  .justify-between{justify-content:space-between}.justify-center{justify-content:center}
  .grid{display:grid}
  .gap-1{gap:4px}.gap-1\.5{gap:6px}.gap-2{gap:8px}.gap-2\.5{gap:10px}.gap-3{gap:12px}.gap-4{gap:16px}
  .mb-2{margin-bottom:8px}.mb-6{margin-bottom:24px}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,30px)}}
  @keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,40px)}}
  ::selection{background:#c5f82a;color:#0a0a0a}
  ::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const C = {
  text:"#f2f2f0", dim:"#9a9a98", faint:"#646462",
  accent:"#c5f82a", amber:"#f5b042", danger:"#ff6b6b", good:"#74e39a",
  panel2:"rgba(255,255,255,0.05)", border:"rgba(255,255,255,0.09)",
};
const barColor = (p) => (p >= 100 ? C.danger : p >= 85 ? C.amber : C.accent);
const CAT_COLORS = ["#c5f82a","#74e39a","#6fb6ff","#c084fc","#ff9d5c","#ff6b9d","#4ecdc4","#f5d442"];
const DEFAULT_CATEGORIES = [
  { id:"c1", name:"Logement", budget:0, color:CAT_COLORS[2] },
  { id:"c2", name:"Tools / SaaS", budget:0, color:CAT_COLORS[0] },
  { id:"c3", name:"Bouffe", budget:0, color:CAT_COLORS[1] },
  { id:"c4", name:"Moto / Transport", budget:0, color:CAT_COLORS[3] },
  { id:"c5", name:"Loisirs", budget:0, color:CAT_COLORS[4] },
  { id:"c6", name:"Autre", budget:0, color:CAT_COLORS[6] },
];
const FONT_SANS = "'Instrument Sans', system-ui, sans-serif";
const FONT_MONO = "'Space Mono', ui-monospace, monospace";
const KEY = "expense-tracker-data";

const GLASS = {
  background:"rgba(18,18,20,0.45)",
  backdropFilter:"blur(22px) saturate(160%)",
  WebkitBackdropFilter:"blur(22px) saturate(160%)",
  border:"1px solid rgba(255,255,255,0.09)",
  borderRadius:20,
  boxShadow:"0 10px 36px rgba(0,0,0,0.40), inset 0 1px 0 rgba(255,255,255,0.07)",
};

const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] != null ? mem[k] : null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } },
};
const loadInit = () => { try { const r = store.get(KEY); if(r) return JSON.parse(r); } catch(e){} return {}; };

const uid = () => Math.random().toString(36).slice(2,10);
const eur = (n) => new Intl.NumberFormat("fr-FR",{ style:"currency", currency:"EUR", maximumFractionDigits:(n||0)%1===0?0:2 }).format(n||0);
const monthKey = (d) => { const t=new Date(d); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0"); };
const monthLabel = (k) => { const [y,m]=k.split("-"); return new Date(y,m-1,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"}); };
const shiftMonth = (k,n) => { const [y,m]=k.split("-").map(Number); return monthKey(new Date(y,m-1+n,1)); };
const todayISO = () => new Date().toISOString().slice(0,10);
const monthlyCost = (s) => (s.cycle==="yearly" ? s.amount/12 : s.amount);
const nextRenewal = (s) => {
  const now=new Date();
  if(s.cycle==="monthly"){ const day=Math.min(s.billingDay||1,28); let d=new Date(now.getFullYear(),now.getMonth(),day); if(d<now)d=new Date(now.getFullYear(),now.getMonth()+1,day); return d; }
  if(!s.renewDate) return null;
  let d=new Date(s.renewDate); while(d<now) d.setFullYear(d.getFullYear()+1); return d;
};
const daysUntil = (d) => Math.ceil((d-new Date())/(1000*60*60*24));

function Icon({ name, size=16, style }){
  const P = {
    plus:<g><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></g>,
    x:<g><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></g>,
    chevronLeft:<polyline points="15 18 9 12 15 6"/>,
    chevronRight:<polyline points="9 18 15 12 9 6"/>,
    edit:<g><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></g>,
    trash:<g><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></g>,
    wallet:<g><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></g>,
    repeat:<g><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></g>,
    target:<g><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g>,
    layout:<g><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></g>,
    trending:<g><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></g>,
    calendar:<g><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></g>,
    alert:<g><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></g>,
    up:<g><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></g>,
    down:<g><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></g>,
    download:<g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></g>,
    upload:<g><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></g>,
    reset:<g><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></g>,
  };
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>{P[name]}</svg>);
}

function Donut({ data, size=150 }){
  const total = data.reduce((a,d)=>a+d.value,0);
  const cx=size/2, cy=size/2, r=size*0.46, ir=size*0.27;
  if(total===0) return null;
  if(data.length===1){ return (<svg width={size} height={size} viewBox={"0 0 "+size+" "+size}><circle cx={cx} cy={cy} r={(r+ir)/2} fill="none" stroke={data[0].color} strokeWidth={r-ir}/></svg>); }
  let acc=0;
  const segs = data.map((d,i)=>{
    const f=d.value/total; const a0=acc*2*Math.PI - Math.PI/2; acc+=f; const a1=acc*2*Math.PI - Math.PI/2; const large=f>0.5?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1), xi0=cx+ir*Math.cos(a0), yi0=cy+ir*Math.sin(a0);
    const dd="M"+x0+","+y0+" A"+r+","+r+" 0 "+large+" 1 "+x1+","+y1+" L"+xi1+","+yi1+" A"+ir+","+ir+" 0 "+large+" 0 "+xi0+","+yi0+" Z";
    return <path key={i} d={dd} fill={d.color}><title>{d.name+" — "+eur(d.value)}</title></path>;
  });
  return <svg width={size} height={size} viewBox={"0 0 "+size+" "+size}>{segs}</svg>;
}
function Bars({ data, height=160 }){
  const max = Math.max.apply(null, data.map(d=>d.total).concat([1]));
  return (
    <div className="flex items-end gap-2" style={{ height }}>
      {data.map((d,i)=>(
        <div key={i} className="flex-1 flex flex-col items-center" style={{ justifyContent:"flex-end", height:"100%" }}>
          <div title={eur(d.total)} style={{ width:"68%", height:((d.total/max)*88+2)+"%", minHeight:2, background:"linear-gradient(180deg,"+C.accent+","+C.accent+"66)", borderRadius:"5px 5px 0 0", transition:"height .4s", boxShadow:"0 0 12px rgba(197,248,42,0.25)" }} />
          <span style={{ fontSize:11, color:C.faint, fontFamily:FONT_MONO, marginTop:6 }}>{d.m}</span>
        </div>
      ))}
    </div>
  );
}
function Spark({ data, w=320, h=64 }){
  const max = Math.max.apply(null, data.map(d=>d.total).concat([1]));
  const n=data.length;
  const pts = data.map((d,i)=>[ (n>1?i/(n-1):0)*w, h-(d.total/max)*(h-6)-3 ]);
  const line = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const area = line+" L"+w+","+h+" L0,"+h+" Z";
  return (
    <svg width="100%" height={h} viewBox={"0 0 "+w+" "+h} preserveAspectRatio="none">
      <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.accent} stopOpacity="0.45"/><stop offset="100%" stopColor={C.accent} stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#sg)"/><path d={line} fill="none" stroke={C.accent} strokeWidth="2"/>
    </svg>
  );
}

function Panel({ children, style, hover }){
  const [h,setH]=useState(false);
  return (
    <div onMouseEnter={()=>hover&&setH(true)} onMouseLeave={()=>hover&&setH(false)}
      style={{ ...GLASS, transition:"border-color .25s, transform .25s, box-shadow .25s",
        borderColor: h ? "rgba(255,255,255,0.20)" : "rgba(255,255,255,0.09)",
        transform: h ? "translateY(-2px)" : "none",
        boxShadow: h ? "0 16px 48px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.10)" : GLASS.boxShadow,
        ...style }}>
      {children}
    </div>
  );
}
const Reveal = ({ delay=0, children }) => (<div style={{ animation:"fadeUp .55s cubic-bezier(.16,1,.3,1) both", animationDelay:delay+"ms" }}>{children}</div>);
const Field = ({ label, children }) => (<label className="flex flex-col gap-1.5"><span style={{ fontSize:11, color:C.dim, letterSpacing:0.4, textTransform:"uppercase" }}>{label}</span>{children}</label>);
const inputStyle = { background:C.panel2, border:"1px solid "+C.border, borderRadius:10, padding:"9px 12px", color:C.text, fontSize:14, outline:"none", width:"100%", fontFamily:FONT_SANS };
const btnAccent = { background:C.accent, color:"#0a0a0a", border:"none", borderRadius:10, padding:"8px 14px", fontSize:13.5, fontWeight:600, cursor:"pointer", fontFamily:FONT_SANS, boxShadow:"0 4px 18px rgba(197,248,42,0.30)" };
const btnGhost = { background:"rgba(255,255,255,0.04)", color:C.dim, border:"1px solid "+C.border, borderRadius:10, padding:"8px 10px", cursor:"pointer", display:"flex", alignItems:"center", gap:6, fontSize:13, fontFamily:FONT_SANS, backdropFilter:"blur(10px)" };
const iconBtn = { background:"transparent", border:"none", color:C.faint, cursor:"pointer", padding:4, display:"flex", alignItems:"center" };
const Empty = ({ text }) => <div style={{ color:C.faint, fontSize:13, padding:"20px 0", textAlign:"center" }}>{text}</div>;
const StatRow = ({ label, value, color, small }) => (
  <Panel hover style={{ padding:16, flex:1, display:"flex", flexDirection:"column", justifyContent:"center" }}>
    <div style={{ fontSize:11.5, color:C.faint, textTransform:"uppercase", letterSpacing:0.5, marginBottom:6 }}>{label}</div>
    <div style={{ fontSize:small?13:22, fontWeight:small?500:700, fontFamily:small?FONT_SANS:FONT_MONO, color }}>{value}</div>
  </Panel>
);

const HERO_STYLE = {
  background:"radial-gradient(460px 360px at 8% 122%, rgba(197,248,42,0.34), transparent 60%), radial-gradient(380px 300px at 95% 0%, rgba(116,227,154,0.12), transparent 55%), linear-gradient(135deg, rgba(58,80,22,0.42), rgba(13,13,15,0.5))",
  border:"1px solid rgba(197,248,42,0.24)",
  boxShadow:"0 12px 50px rgba(0,0,0,0.45), 0 0 60px rgba(197,248,42,0.06), inset 0 1px 0 rgba(255,255,255,0.10)",
};

function App(){
  const init = useMemo(loadInit, []);
  const [tab,setTab]=useState("dashboard");
  const [month,setMonth]=useState(monthKey(new Date()));
  const [expenses,setExpenses]=useState(init.expenses||[]);
  const [subs,setSubs]=useState(init.subs||[]);
  const [categories,setCategories]=useState(init.categories&&init.categories.length?init.categories:DEFAULT_CATEGORIES);
  const [income,setIncome]=useState(init.income||0);
  const fileRef = React.useRef(null);

  useEffect(()=>{ store.set(KEY, JSON.stringify({ expenses, subs, categories, income })); }, [expenses,subs,categories,income]);

  const catById = useMemo(()=>Object.fromEntries(categories.map(c=>[c.id,c])), [categories]);
  const monthExpenses = useMemo(()=>expenses.filter(e=>monthKey(e.date)===month), [expenses,month]);
  const activeSubs = useMemo(()=>subs.filter(s=>s.active!==false), [subs]);
  const subsMonthly = useMemo(()=>activeSubs.reduce((a,s)=>a+monthlyCost(s),0), [activeSubs]);
  const byCat = useMemo(()=>{ const m={}; categories.forEach(c=>m[c.id]=0); monthExpenses.forEach(e=>m[e.catId]=(m[e.catId]||0)+e.amount); activeSubs.forEach(s=>m[s.catId]=(m[s.catId]||0)+monthlyCost(s)); return m; }, [categories,monthExpenses,activeSubs]);
  const spentTotal = useMemo(()=>Object.values(byCat).reduce((a,b)=>a+b,0), [byCat]);
  const budgetTotal = useMemo(()=>categories.reduce((a,c)=>a+(c.budget||0),0), [categories]);

  const addExpense=(e)=>setExpenses(p=>[{id:uid(),...e},...p]);
  const updateExpense=(id,patch)=>setExpenses(p=>p.map(x=>x.id===id?{...x,...patch}:x));
  const delExpense=(id)=>setExpenses(p=>p.filter(x=>x.id!==id));
  const addSub=(s)=>setSubs(p=>[{id:uid(),active:true,...s},...p]);
  const updateSub=(id,patch)=>setSubs(p=>p.map(x=>x.id===id?{...x,...patch}:x));
  const delSub=(id)=>setSubs(p=>p.filter(x=>x.id!==id));
  const toggleSub=(id)=>setSubs(p=>p.map(x=>x.id===id?{...x,active:!(x.active!==false)}:x));
  const updateCat=(id,patch)=>setCategories(p=>p.map(c=>c.id===id?{...c,...patch}:c));
  const addCat=()=>setCategories(p=>[...p,{id:uid(),name:"Nouvelle catégorie",budget:0,color:CAT_COLORS[p.length%CAT_COLORS.length]}]);
  const delCat=(id)=>setCategories(p=>p.filter(c=>c.id!==id));

  const exportData=()=>{ const blob=new Blob([JSON.stringify({expenses,subs,categories,income},null,2)],{type:"application/json"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="depenses-"+todayISO()+".json"; a.click(); URL.revokeObjectURL(url); };
  const importData=(file)=>{ const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.expenses)setExpenses(d.expenses); if(d.subs)setSubs(d.subs); if(d.categories)setCategories(d.categories); if(typeof d.income==="number")setIncome(d.income);}catch(e){alert("Fichier invalide");} }; r.readAsText(file); };
  const resetAll=()=>{ if(!confirm("Tout effacer ? Cette action est définitive.")) return; setExpenses([]); setSubs([]); setCategories(DEFAULT_CATEGORIES); setIncome(0); };

  const tabs=[
    {id:"dashboard",label:"Tableau de bord",icon:"layout"},
    {id:"expenses",label:"Dépenses",icon:"wallet"},
    {id:"subs",label:"Abonnements",icon:"repeat"},
    {id:"budgets",label:"Budgets",icon:"target"},
  ];

  return (
    <div style={{ position:"relative", minHeight:"100vh", background:"#060607", color:C.text, fontFamily:FONT_SANS, overflow:"hidden" }}>
      {/* orbes de lumière */}
      <div style={{ position:"fixed", top:"-18%", right:"-8%", width:620, height:620, borderRadius:"50%", background:"radial-gradient(circle, rgba(197,248,42,0.20), transparent 70%)", filter:"blur(70px)", pointerEvents:"none", zIndex:0, animation:"float1 18s ease-in-out infinite" }} />
      <div style={{ position:"fixed", bottom:"-22%", left:"-12%", width:680, height:680, borderRadius:"50%", background:"radial-gradient(circle, rgba(116,227,154,0.14), transparent 70%)", filter:"blur(90px)", pointerEvents:"none", zIndex:0, animation:"float2 22s ease-in-out infinite" }} />
      <div style={{ position:"fixed", top:"38%", left:"42%", width:460, height:460, borderRadius:"50%", background:"radial-gradient(circle, rgba(60,100,30,0.16), transparent 70%)", filter:"blur(80px)", pointerEvents:"none", zIndex:0 }} />

      <div style={{ position:"relative", zIndex:1, maxWidth:980, margin:"0 auto", padding:24 }}>
        <Reveal>
          <div className="flex items-center justify-between mb-6 flex-wrap gap-3">
            <div>
              <h1 style={{ fontSize:22, fontWeight:700, letterSpacing:-0.5 }}>Suivi de dépenses</h1>
              <p style={{ color:C.faint, fontSize:13 }}>{eur(subsMonthly)}/mois d'abonnements actifs</p>
            </div>
            <div className="flex items-center gap-2 flex-wrap">
              <div className="flex items-center" style={{ ...GLASS, borderRadius:10, boxShadow:"none" }}>
                <button onClick={()=>setMonth(shiftMonth(month,-1))} style={{...iconBtn,padding:8,color:C.dim}}><Icon name="chevronLeft" /></button>
                <span style={{ fontFamily:FONT_MONO, fontSize:13, padding:"0 6px", minWidth:120, textAlign:"center", textTransform:"capitalize" }}>{monthLabel(month)}</span>
                <button onClick={()=>setMonth(shiftMonth(month,1))} style={{...iconBtn,padding:8,color:C.dim}}><Icon name="chevronRight" /></button>
              </div>
              <button onClick={exportData} style={btnGhost} title="Exporter une sauvegarde"><Icon name="download" size={15} /></button>
              <button onClick={()=>fileRef.current&&fileRef.current.click()} style={btnGhost} title="Importer une sauvegarde"><Icon name="upload" size={15} /></button>
              <button onClick={resetAll} style={{...btnGhost,color:C.faint}} title="Tout réinitialiser"><Icon name="reset" size={15} /></button>
              <input ref={fileRef} type="file" accept="application/json" style={{display:"none"}} onChange={(e)=>e.target.files[0]&&importData(e.target.files[0])} />
            </div>
          </div>
        </Reveal>

        <Reveal delay={60}>
          <div className="flex gap-1.5 mb-6 flex-wrap">
            {tabs.map(t=>{ const on=tab===t.id; return (
              <button key={t.id} onClick={()=>setTab(t.id)} className="flex items-center gap-2"
                style={{ padding:"9px 15px", borderRadius:12, fontSize:13.5, fontWeight:on?600:500, cursor:"pointer",
                  border:"1px solid "+(on?"rgba(197,248,42,0.4)":"rgba(255,255,255,0.08)"),
                  background:on?"rgba(197,248,42,0.13)":"rgba(255,255,255,0.03)",
                  color:on?C.accent:C.dim, backdropFilter:"blur(12px)",
                  boxShadow:on?"0 0 20px rgba(197,248,42,0.18)":"none", transition:"all .2s" }}>
                <Icon name={t.icon} size={15} /> {t.label}
              </button>); })}
          </div>
        </Reveal>

        {tab==="dashboard" && <Dashboard {...{month,spentTotal,budgetTotal,subsMonthly,income,setIncome,byCat,categories,expenses,subs:activeSubs,catById}} />}
        {tab==="expenses" && <Expenses {...{list:monthExpenses,categories,catById,onAdd:addExpense,onUpdate:updateExpense,onDel:delExpense}} />}
        {tab==="subs" && <Subs {...{subs,categories,catById,onAdd:addSub,onUpdate:updateSub,onDel:delSub,onToggle:toggleSub,subsMonthly}} />}
        {tab==="budgets" && <Budgets {...{categories,byCat,onUpdate:updateCat,onAdd:addCat,onDel:delCat}} />}
      </div>
    </div>
  );
}

function Dashboard({ month, spentTotal, budgetTotal, subsMonthly, income, setIncome, byCat, categories, expenses, subs, catById }){
  const pct = budgetTotal>0 ? Math.min((spentTotal/budgetTotal)*100,100) : 0;
  const curPon = useMemo(()=>expenses.filter(e=>monthKey(e.date)===month).reduce((a,e)=>a+e.amount,0), [expenses,month]);
  const prevPon = useMemo(()=>{ const pk=shiftMonth(month,-1); return expenses.filter(e=>monthKey(e.date)===pk).reduce((a,e)=>a+e.amount,0); }, [expenses,month]);
  const delta = prevPon>0 ? ((curPon-prevPon)/prevPon)*100 : null;
  const solde = (income||0) - spentTotal;
  const savings = income>0 ? ((income-spentTotal)/income)*100 : null;
  const savingsColor = savings===null ? C.faint : savings>=20 ? C.good : savings>=0 ? C.amber : C.danger;
  const pieData = categories.map(c=>({name:c.name,value:byCat[c.id]||0,color:c.color})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);
  const trend = useMemo(()=>{ const [y,m]=month.split("-").map(Number); const arr=[]; for(let i=5;i>=0;i--){ const d=new Date(y,m-1-i,1); const k=monthKey(d); const pon=expenses.filter(e=>monthKey(e.date)===k).reduce((a,e)=>a+e.amount,0); arr.push({m:d.toLocaleDateString("fr-FR",{month:"short"}),total:Math.round(pon)});} return arr; }, [expenses,month]);
  const upcoming = useMemo(()=>subs.map(s=>({s,date:nextRenewal(s)})).filter(x=>x.date&&daysUntil(x.date)<=30).sort((a,b)=>a.date-b.date), [subs]);

  return (
    <div className="flex flex-col gap-4">
      <Reveal delay={120}>
        <div className="grid gap-4" style={{ gridTemplateColumns:"1.5fr 1fr" }}>
          <Panel hover style={{ padding:24, position:"relative", overflow:"hidden", ...HERO_STYLE }}>
            <div style={{ fontSize:11.5, color:"rgba(255,255,255,0.55)", textTransform:"uppercase", letterSpacing:0.6, marginBottom:10 }}>Dépensé ce mois</div>
            <div style={{ fontSize:44, fontWeight:700, fontFamily:FONT_MONO, lineHeight:1, textShadow:"0 2px 20px rgba(0,0,0,0.3)" }}>{eur(spentTotal)}</div>
            {delta!==null &&
              <div className="flex items-center gap-1.5" style={{ marginTop:14, fontSize:12.5 }}>
                <Icon name={delta>=0?"up":"down"} size={15} style={{ color:delta>=0?C.danger:C.good }} />
                <span style={{ color:delta>=0?C.danger:C.good, fontFamily:FONT_MONO, fontWeight:700 }}>{Math.abs(delta).toFixed(1)}%</span>
                <span style={{ color:"rgba(255,255,255,0.5)" }}>de dépenses vs mois dernier</span>
              </div>}
            <div style={{ position:"absolute", bottom:0, left:0, right:0, opacity:0.6 }}><Spark data={trend} /></div>
          </Panel>
          <div className="flex flex-col gap-4">
            <Panel hover style={{ padding:16, flex:1, display:"flex", flexDirection:"column", justifyContent:"center" }}>
              <div style={{ fontSize:11.5, color:C.faint, textTransform:"uppercase", letterSpacing:0.5, marginBottom:6 }}>Revenu mensuel</div>
              <div className="flex items-center gap-1">
                <input value={income||""} onChange={e=>setIncome(parseFloat(e.target.value.replace(",","."))||0)} placeholder="0" inputMode="decimal" style={{ background:"transparent", border:"none", color:C.text, fontSize:22, fontWeight:700, fontFamily:FONT_MONO, width:96, outline:"none", padding:0 }} />
                <span style={{ fontFamily:FONT_MONO, fontSize:18, color:C.dim }}>€</span>
              </div>
            </Panel>
            <StatRow label="Solde du mois" value={income>0?eur(solde):"—"} color={income>0?(solde>=0?C.good:C.danger):C.faint} small={income<=0} />
            <StatRow label="Taux d'épargne" value={savings===null?"définis ton revenu":Math.round(savings)+" %"} color={savingsColor} small={savings===null} />
          </div>
        </div>
      </Reveal>

      {budgetTotal>0 &&
        <Reveal delay={180}>
          <Panel hover style={{ padding:18 }}>
            <div className="flex justify-between mb-2" style={{ fontSize:13, color:C.dim }}>
              <span>Budget · {eur(spentTotal)} / {eur(budgetTotal)}</span>
              <span style={{ fontFamily:FONT_MONO, color:barColor(pct) }}>{Math.round(pct)}%</span>
            </div>
            <div style={{ height:10, background:"rgba(255,255,255,0.06)", borderRadius:6, overflow:"hidden" }}>
              <div style={{ width:pct+"%", height:"100%", background:barColor(pct), transition:"width .5s cubic-bezier(.16,1,.3,1)", boxShadow:"0 0 14px "+barColor(pct)+"66" }} />
            </div>
          </Panel>
        </Reveal>}

      <Reveal delay={240}>
        <div className="grid gap-4" style={{ gridTemplateColumns:"repeat(auto-fit, minmax(290px, 1fr))" }}>
          <Panel hover style={{ padding:18 }}>
            <h3 style={{ fontSize:14, fontWeight:600, marginBottom:12 }}>Répartition du mois</h3>
            {pieData.length===0 ? <Empty text="Aucune dépense ce mois" /> :
              <div className="flex items-center gap-4 flex-wrap">
                <Donut data={pieData} />
                <div className="flex flex-col gap-1.5 flex-1">
                  {pieData.map(d=>(<div key={d.name} className="flex items-center justify-between" style={{ fontSize:13 }}>
                    <span className="flex items-center gap-2"><span style={{width:9,height:9,borderRadius:3,background:d.color,boxShadow:"0 0 8px "+d.color+"88"}} />{d.name}</span>
                    <span style={{ fontFamily:FONT_MONO, color:C.dim }}>{eur(d.value)}</span></div>))}
                </div>
              </div>}
          </Panel>

          <Panel hover style={{ padding:18 }}>
            <h3 className="flex items-center gap-2" style={{ fontSize:14, fontWeight:600, marginBottom:4 }}><Icon name="trending" size={15} style={{color:C.accent}} /> Dépenses · 6 mois</h3>
            <p style={{ fontSize:11, color:C.faint, marginBottom:12 }}>hors abonnements</p>
            <Bars data={trend} height={140} />
          </Panel>

          <Panel hover style={{ padding:18 }}>
            <h3 className="flex items-center gap-2" style={{ fontSize:14, fontWeight:600, marginBottom:12 }}><Icon name="calendar" size={15} style={{color:C.accent}} /> Renouvellements (30j)</h3>
            {upcoming.length===0 ? <Empty text="Aucun renouvellement prévu" /> :
              <div className="flex flex-col gap-2.5">
                {upcoming.map(({s,date})=>{ const d=daysUntil(date); return (
                  <div key={s.id} className="flex items-center justify-between" style={{ fontSize:13.5 }}>
                    <span className="flex items-center gap-2"><span style={{width:9,height:9,borderRadius:3,background:(catById[s.catId]&&catById[s.catId].color)||C.dim}} />{s.name}</span>
                    <span className="flex items-center gap-3"><span style={{ color:d<=3?C.danger:C.faint, fontSize:12 }}>{d===0?"auj.":"dans "+d+"j"}</span><span style={{ fontFamily:FONT_MONO }}>{eur(s.amount)}</span></span>
                  </div>); })}
              </div>}
          </Panel>
        </div>
      </Reveal>
    </div>
  );
}

function Expenses({ list, categories, catById, onAdd, onUpdate, onDel }){
  const [open,setOpen]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [label,setLabel]=useState(""); const [amount,setAmount]=useState("");
  const [catId,setCatId]=useState((categories[0]&&categories[0].id)||""); const [date,setDate]=useState(todayISO());
  const reset=()=>{ setLabel("");setAmount("");setDate(todayISO());setEditingId(null); };
  const toggle=()=>{ if(open){reset();} setOpen(!open); };
  const startEdit=(e)=>{ setLabel(e.label); setAmount(String(e.amount)); setCatId(e.catId); setDate(e.date); setEditingId(e.id); setOpen(true); };
  const submit=()=>{ const a=parseFloat(amount.replace(",",".")); if(!a||a<=0)return; const data={label:label.trim()||"Dépense",amount:a,catId,date}; if(editingId)onUpdate(editingId,data); else onAdd(data); reset(); setOpen(false); };
  const total=list.reduce((a,e)=>a+e.amount,0);
  return (
    <Reveal delay={120}><div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span style={{color:C.dim,fontSize:13}}>{list.length} dépenses · {eur(total)} en ponctuel</span>
        <button onClick={toggle} className="flex items-center gap-2" style={btnAccent}><Icon name={open?"x":"plus"} size={15} /> {open?"Fermer":"Ajouter"}</button>
      </div>
      {open &&
        <Panel style={{padding:18}}>
          <div className="grid gap-3" style={{gridTemplateColumns:"1.4fr 1fr 1fr 1fr auto",alignItems:"end"}}>
            <Field label="Libellé"><input style={inputStyle} value={label} onChange={e=>setLabel(e.target.value)} placeholder="ex: Courses" /></Field>
            <Field label="Montant €"><input style={{...inputStyle,fontFamily:FONT_MONO}} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0" inputMode="decimal" /></Field>
            <Field label="Catégorie"><select style={inputStyle} value={catId} onChange={e=>setCatId(e.target.value)}>{categories.map(c=><option key={c.id} value={c.id} style={{background:"#161618"}}>{c.name}</option>)}</select></Field>
            <Field label="Date"><input type="date" style={{...inputStyle,fontFamily:FONT_MONO}} value={date} onChange={e=>setDate(e.target.value)} /></Field>
            <button onClick={submit} style={{...btnAccent,height:39}}>{editingId?"Modifier":"OK"}</button>
          </div>
        </Panel>}
      <Panel style={{padding:8}}>
        {list.length===0 ? <Empty text="Aucune dépense ce mois — ajoute-en une" /> :
          list.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>(
            <div key={e.id} className="flex items-center justify-between" style={{padding:"10px 12px",borderBottom:"1px solid "+C.border}}>
              <div className="flex items-center gap-3">
                <span style={{width:9,height:9,borderRadius:3,background:(catById[e.catId]&&catById[e.catId].color)||C.dim}} />
                <div><div style={{fontSize:14}}>{e.label}</div><div style={{fontSize:11.5,color:C.faint,fontFamily:FONT_MONO}}>{new Date(e.date).toLocaleDateString("fr-FR")} · {catById[e.catId]&&catById[e.catId].name}</div></div>
              </div>
              <div className="flex items-center gap-3">
                <span style={{fontFamily:FONT_MONO,fontWeight:700}}>{eur(e.amount)}</span>
                <button onClick={()=>startEdit(e)} style={iconBtn} title="Modifier"><Icon name="edit" size={14} /></button>
                <button onClick={()=>onDel(e.id)} style={iconBtn} title="Supprimer"><Icon name="trash" size={14} /></button>
              </div>
            </div>
          ))}
      </Panel>
    </div></Reveal>
  );
}

function Subs({ subs, categories, catById, onAdd, onUpdate, onDel, onToggle, subsMonthly }){
  const [open,setOpen]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [name,setName]=useState(""); const [amount,setAmount]=useState("");
  const [cycle,setCycle]=useState("monthly"); const [billingDay,setBillingDay]=useState("1"); const [renewDate,setRenewDate]=useState(todayISO());
  const [catId,setCatId]=useState((categories.find(c=>/saas|tool/i.test(c.name))||categories[0]||{}).id||"");
  const reset=()=>{ setName("");setAmount("");setCycle("monthly");setBillingDay("1");setRenewDate(todayISO());setEditingId(null); };
  const toggle=()=>{ if(open){reset();} setOpen(!open); };
  const startEdit=(s)=>{ setName(s.name); setAmount(String(s.amount)); setCycle(s.cycle); setBillingDay(String(s.billingDay||1)); setRenewDate(s.renewDate||todayISO()); setCatId(s.catId); setEditingId(s.id); setOpen(true); };
  const submit=()=>{ const a=parseFloat(amount.replace(",",".")); if(!a||a<=0||!name.trim())return; const data={name:name.trim(),amount:a,cycle,billingDay:cycle==="monthly"?(parseInt(billingDay)||1):undefined,renewDate:cycle==="yearly"?renewDate:undefined,catId}; if(editingId)onUpdate(editingId,data); else onAdd(data); reset(); setOpen(false); };
  const yearly=subsMonthly*12;
  return (
    <Reveal delay={120}><div className="flex flex-col gap-4">
      <div className="flex items-center justify-between flex-wrap gap-2">
        <span style={{color:C.dim,fontSize:13}}>{eur(subsMonthly)}/mois · {eur(yearly)}/an</span>
        <button onClick={toggle} className="flex items-center gap-2" style={btnAccent}><Icon name={open?"x":"plus"} size={15} /> {open?"Fermer":"Ajouter"}</button>
      </div>
      {open &&
        <Panel style={{padding:18}}>
          <div className="grid gap-3" style={{gridTemplateColumns:"1.4fr 1fr 1fr 1fr 1fr auto",alignItems:"end"}}>
            <Field label="Nom"><input style={inputStyle} value={name} onChange={e=>setName(e.target.value)} placeholder="ex: Figma" /></Field>
            <Field label="Montant €"><input style={{...inputStyle,fontFamily:FONT_MONO}} value={amount} onChange={e=>setAmount(e.target.value)} placeholder="0" inputMode="decimal" /></Field>
            <Field label="Cycle"><select style={inputStyle} value={cycle} onChange={e=>setCycle(e.target.value)}><option value="monthly" style={{background:"#161618"}}>Mensuel</option><option value="yearly" style={{background:"#161618"}}>Annuel</option></select></Field>
            {cycle==="monthly"
              ? <Field label="Jour prélèvt"><input style={{...inputStyle,fontFamily:FONT_MONO}} value={billingDay} onChange={e=>setBillingDay(e.target.value)} inputMode="numeric" placeholder="1-28" /></Field>
              : <Field label="Renouvellement"><input type="date" style={{...inputStyle,fontFamily:FONT_MONO}} value={renewDate} onChange={e=>setRenewDate(e.target.value)} /></Field>}
            <Field label="Catégorie"><select style={inputStyle} value={catId} onChange={e=>setCatId(e.target.value)}>{categories.map(c=><option key={c.id} value={c.id} style={{background:"#161618"}}>{c.name}</option>)}</select></Field>
            <button onClick={submit} style={{...btnAccent,height:39}}>{editingId?"Modifier":"OK"}</button>
          </div>
        </Panel>}
      <Panel style={{padding:8}}>
        {subs.length===0 ? <Empty text="Aucun abonnement enregistré" /> :
          subs.map(s=>{ const off=s.active===false; const date=nextRenewal(s); return (
            <div key={s.id} className="flex items-center justify-between" style={{padding:"10px 12px",borderBottom:"1px solid "+C.border,opacity:off?0.45:1}}>
              <div className="flex items-center gap-3">
                <span style={{width:9,height:9,borderRadius:3,background:(catById[s.catId]&&catById[s.catId].color)||C.dim}} />
                <div><div style={{fontSize:14}}>{s.name}</div><div style={{fontSize:11.5,color:C.faint,fontFamily:FONT_MONO}}>{s.cycle==="yearly"?"annuel":"mensuel"}{date?" · proch. "+date.toLocaleDateString("fr-FR"):""} · {eur(monthlyCost(s))}/mois</div></div>
              </div>
              <div className="flex items-center gap-3">
                <span style={{fontFamily:FONT_MONO,fontWeight:700}}>{eur(s.amount)}</span>
                <button onClick={()=>onToggle(s.id)} style={{...iconBtn,color:off?C.faint:C.good}} title={off?"Réactiver":"Mettre en pause"}><Icon name="repeat" size={14} /></button>
                <button onClick={()=>startEdit(s)} style={iconBtn} title="Modifier"><Icon name="edit" size={14} /></button>
                <button onClick={()=>onDel(s.id)} style={iconBtn} title="Supprimer"><Icon name="trash" size={14} /></button>
              </div>
            </div>); })}
      </Panel>
    </div></Reveal>
  );
}

function Budgets({ categories, byCat, onUpdate, onAdd, onDel }){
  return (
    <Reveal delay={120}><div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <span style={{color:C.dim,fontSize:13}}>Budget mensuel par catégorie (0 = pas de limite)</span>
        <button onClick={onAdd} className="flex items-center gap-2" style={btnAccent}><Icon name="plus" size={15} /> Catégorie</button>
      </div>
      <Panel style={{padding:8}}>
        {categories.map(c=>{ const spent=byCat[c.id]||0; const over=c.budget>0&&spent>c.budget; const raw=c.budget>0?(spent/c.budget)*100:0; const pct=Math.min(raw,100); return (
          <div key={c.id} style={{padding:12,borderBottom:"1px solid "+C.border}}>
            <div className="flex items-center justify-between gap-3 mb-2 flex-wrap">
              <div className="flex items-center gap-2.5 flex-1" style={{minWidth:160}}>
                <span style={{width:10,height:10,borderRadius:3,background:c.color,boxShadow:"0 0 8px "+c.color+"88"}} />
                <input value={c.name} onChange={e=>onUpdate(c.id,{name:e.target.value})} style={{...inputStyle,padding:"4px 8px",fontSize:14,background:"transparent",border:"none"}} />
              </div>
              <div className="flex items-center gap-2">
                <span style={{fontSize:12,color:over?C.danger:C.dim,fontFamily:FONT_MONO}}>{eur(spent)} {c.budget>0?"/ "+eur(c.budget):""}</span>
                <input value={c.budget||""} onChange={e=>onUpdate(c.id,{budget:parseFloat(e.target.value.replace(",","."))||0})} placeholder="budget" inputMode="decimal" style={{...inputStyle,width:90,fontFamily:FONT_MONO,padding:"6px 10px"}} />
                <button onClick={()=>onDel(c.id)} style={iconBtn} title="Supprimer"><Icon name="trash" size={14} /></button>
              </div>
            </div>
            {c.budget>0 && <div style={{height:6,background:"rgba(255,255,255,0.06)",borderRadius:4,overflow:"hidden"}}><div style={{width:pct+"%",height:"100%",background:barColor(raw),transition:"width .4s cubic-bezier(.16,1,.3,1)",boxShadow:"0 0 12px "+barColor(raw)+"66"}} /></div>}
            {over && <div className="flex items-center gap-1.5" style={{color:C.danger,fontSize:11.5,marginTop:5}}><Icon name="alert" size={12} /> Dépassé de {eur(spent-c.budget)}</div>}
          </div>); })}
      </Panel>
    </div></Reveal>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
